syntax = "proto3";

package xodus;

// Schema only, not yet wired to a handler - `connection::proto::handle` still
// `unimplemented!()`s. These exist so `xgameruntime-rs`'s native XUser/XStore work
// (Phase 3/4 of PLAN.md) has message shapes to code against; expect fields to be
// revised once something on either end actually consumes them.
enum XodusMessageType {
    UNKNOWN = 0;
    PING = 1;
    PONG = 2;
    MSA_TOKEN_REQUEST = 3;
    MSA_TOKEN_RESPONSE = 4;
    XSTS_TOKEN_REQUEST = 5;
    XSTS_TOKEN_RESPONSE = 6;
    USER_INFO_REQUEST = 7;
    USER_INFO_RESPONSE = 8;
    LICENSE_REQUEST = 9;
    LICENSE_RESPONSE = 10;
    DEVICE_TOKEN_REQUEST = 11;
    DEVICE_TOKEN_RESPONSE = 12;
    ENTITLED_PRODUCTS_REQUEST = 13;
    ENTITLED_PRODUCTS_RESPONSE = 14;
    COLLECTIONS_ID_REQUEST = 15;
    COLLECTIONS_ID_RESPONSE = 16;
    LICENSE_TOKEN_REQUEST = 17;
    LICENSE_TOKEN_RESPONSE = 18;
    ASSOCIATED_PRODUCTS_REQUEST = 19;
    ASSOCIATED_PRODUCTS_RESPONSE = 20;
    RESOLVE_PRODUCT_ID_REQUEST = 21;
    RESOLVE_PRODUCT_ID_RESPONSE = 22;
}

// XUserGetTokenAndSignature: an XSTS token + signature for one relying party, signed
// with the device's proof key.
message XstsTokenRequest {
    string relying_party = 1;
    string http_method = 2;
    string url = 3;
    bytes body = 4;
    bool force_refresh = 5;
}

message XstsTokenResponse {
    string token = 1;
    // XBL3.0 Authorization header value, e.g. "XBL3.0 x=...;<token>".
    string authorization_header = 2;
    // ES256 request signature for the same call, when the relying party requires one.
    string signature_header = 3;
    int64 expiry = 4;
}

// XUserGetGamertag / XUserGetId / age group and privacy claims off the signed-in
// user's XSTS token.
message UserInfoRequest {
}

message UserInfoResponse {
    string xuid = 1;
    string gamertag = 2;
    string gamertag_modern = 3;
    string age_group = 4;
}

// XStoreQueryGameLicenseAsync's real backing.
message LicenseRequest {
    string content_id = 1;
    string market = 2;
}

message LicenseResponse {
    bool is_active = 1;
    bool is_trial = 2;
    int64 trial_time_remaining_seconds = 3;
    string sku_store_id = 4;
    // Zero for a license with no expiration.
    int64 expiration_date = 5;
}

// XUserGetDeviceInfoId equivalent - the provisioned device identity, not a per-user
// token.
message DeviceTokenRequest {
}

message DeviceTokenResponse {
    string device_id = 1;
    string token = 2;
    int64 expiry = 3;
}

// XStoreQueryEntitledProductsAsync - titles this account owns outright or through a
// subscription (PC Game Pass / Game Pass Ultimate), from the "My games" library
// (`docs/xbox/xboxservices.md`). Single page only - MyGames doesn't paginate today.
message EntitledProductsRequest {
    string market = 1;
}

message EntitledProductsResponse {
    repeated EntitledProduct products = 1;
}

message EntitledProduct {
    string store_id = 1;
    string title = 2;
    string product_kind = 3;
    bool included_in_game_pass = 4;
}

// XStoreGetUserCollectionsIdAsync - service_ticket/publisher_user_id are the caller's
// own opaque values, forwarded verbatim to collections.mp.microsoft.com/v7.0/beneficiaries/me/keys
// (confirmed via the real xgameruntime.dll's embedded service-configuration blob).
message CollectionsIdRequest {
    string service_ticket = 1;
    string publisher_user_id = 2;
}

message CollectionsIdResponse {
    // Raw response body - an opaque signed blob the title's own backend is meant to
    // verify, not something xodus has a documented schema for.
    string key = 1;
}

// XStoreQueryLicenseTokenAsync - product_ids[0] is the parent product, the rest are
// related products, matching the real GDK signature's single flat array. Real endpoint
// confirmed as licensing.mp.microsoft.com/v8.0/licenseToken via the same service-config
// blob.
message LicenseTokenRequest {
    repeated string product_ids = 1;
    string custom_developer_string = 2;
}

message LicenseTokenResponse {
    // Raw response body, opaque - see CollectionsIdResponse.key.
    string token = 1;
}

// XStoreQueryAssociatedProductsAsync - package_family_name is computed by xodus-cli run
// from the running package's AppxManifest.xml (there is no other way for xodus-service to
// learn which package is running). Resolved to a ProductId, then queried for products
// "sellable by" (associated with) it, both via displaycatalog.mp.microsoft.com endpoints
// recovered from the real xgameruntime.dll's embedded service-configuration blob.
message AssociatedProductsRequest {
    string package_family_name = 1;
    string market = 2;
    uint32 max_items = 3;
}

message AssociatedProductsResponse {
    repeated AssociatedProduct products = 1;
}

message AssociatedProduct {
    string store_id = 1;
    string title = 2;
    string product_kind = 3;
}

// XPersistentLocalStorageMountForPackage - packageIdentifier is a PackageFamilyName (matching
// XPackageGetCurrentProcessPackageIdentifier's real backing, Win32's GetCurrentPackageFamilyName,
// per strings recovered from the real xgameruntime.dll), but RelatedProducts in
// MicrosoftGame.config is declared as StoreIds - this resolves the former to the latter so
// xgameruntime-rs can check it against the running title's own declared RelatedProducts list.
message ResolveProductIdRequest {
    string package_family_name = 1;
    string market = 2;
}

message ResolveProductIdResponse {
    // Empty when unresolvable - honest absence, not an error.
    string product_id = 1;
}
