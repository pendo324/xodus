name: Combine Proton build

# Bakes xgameruntime and XCurl into the latest xodus-proton Snapshot build, the
# way docs/running-a-title.md's manual steps do today, and uploads the result
# as a workflow artifact. Manual only - there is no automatic trigger, since
# each of the three inputs (xgameruntime, XCurl, Proton) moves independently.
on:
  workflow_dispatch:

jobs:
  combine:
    name: Combine
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache pv
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-apt-pv-${{ hashFiles('.github/workflows/combine-proton.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-pv-

      - name: Install pv
        run: |
          sudo apt-get update
          mkdir -p "$HOME/apt-cache/partial"
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get install -y --download-only -o Dir::Cache::Archives="$HOME/apt-cache" pv
          fi
          sudo dpkg -i "$HOME"/apt-cache/*.deb || sudo apt-get install -f -y

      - name: Combine
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_ARTIFACT_TOKEN }}
        run: hack/combine-proton.sh dist

      - name: Upload x86_64 bundle
        uses: actions/upload-artifact@v7
        with:
          name: xodus-proton-bundle-x86_64
          path: |
            dist/*-x86_64-xgameruntime-rs.tar.xz
            dist/*-x86_64-xgameruntime-rs.tar.xz.sha512sum
            dist/xcurl
          if-no-files-found: error

      - name: Upload arm64 bundle
        uses: actions/upload-artifact@v7
        with:
          name: xodus-proton-bundle-arm64
          path: |
            dist/*-arm64-xgameruntime-rs.tar.xz
            dist/*-arm64-xgameruntime-rs.tar.xz.sha512sum
            dist/xcurl
          if-no-files-found: error
