[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
chrono = "0.4.42"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
base64 = { version = "0.22.1" }

[patch.crates-io]
ntfs = { git = "https://github.com/xodus-gaming/ntfs.git" }

# TODO: drop once the proof-key changes land upstream and the rev in
# crates/xodus/Cargo.toml is bumped.
[patch."https://github.com/xodus-gaming/xal-rs"]
xal = { path = "../xal-rs" }
